<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>철학자 명언 탐구</title>
    <style>
        body {
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: #2c3e50;
        }
        .button-group {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 2rem;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            font-size: 1rem;
        }
        button:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
        }
        .display-area {
            min-height: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border-top: 2px solid #eee;
            padding-top: 20px;
        }
        #photo-display {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
            border: 4px solid #3498db;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #bio-display {
            font-size: 0.9rem;
            color: #7f8c8d;
            margin-bottom: 15px;
            font-weight: bold;
        }
        #quote-display {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }
        .quote {
            font-style: italic;
            line-height: 1.6;
            animation: fadeIn 0.5s ease-in-out;
            margin: 0;
            padding: 5px 0;
        }
        .quote::before {
            content: '"';
            font-size: 1.2rem;
            color: #3498db;
            margin-right: 5px;
        }
        .quote::after {
            content: '"';
            font-size: 1.2rem;
            color: #3498db;
            margin-left: 5px;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>철학자를 선택하세요</h1>
    <div class="button-group">
        <button onclick="showQuotes('nietzsche')">니체</button>
        <button onclick="showQuotes('kant')">칸트</button>
        <button onclick="showQuotes('aristotle')">아리스토텔레스</button>
    </div>
    
    <div class="display-area">
        <img id="photo-display" src="" alt="철학자 사진">
        <div id="bio-display"></div>
        <div id="quote-display">
            <p style="color: #95a5a6;">버튼을 누르면 사진, 생물연도, 명언이 나타납니다.</p>
        </div>
    </div>
</div>

<script>
    const philosopherData = {
        nietzsche: {
            bio: "1844년 - 1900년",
            photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/1/1b/Nietzsche187a.jpg/220px-Nietzsche187a.jpg",
            quotes: [
                "나를 죽이지 못하는 것은 나를 더 강하게 만든다.",
                "신은 죽었다.",
                "음악이 없다면 삶은 잘못된 것일 것이다."
            ]
        },
        kant: {
            bio: "1724년 - 1804년",
            photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/4/43/Immanuel_Kant_%28painted_portrait%29.jpg/220px-Immanuel_Kant_%28painted_portrait%29.jpg",
            quotes: [
                "과학은 정리된 지식이고, 지혜는 정리된 인생이다.",
                "동물을 대하는 태도를 보면 그 사람의 본성을 알 수 있다.",
                "네 의지의 격률이 언제나 동시에 보편적 입법의 원리가 될 수 있도록 행위하라."
            ]
        },
        aristotle: {
            bio: "기원전 384년 - 기원전 322년",
            photo: "https://upload.wikimedia.org/wikipedia/commons/thumb/a/ae/Aristotle_Altemps_Inv8575.jpg/220px-Aristotle_Altemps_Inv8575.jpg",
            quotes: [
                "행복은 우리 자신에게 달려 있다.",
                "탁월함은 하나의 행위가 아니라 습관이다.",
                "교육의 뿌리는 쓰지만 그 열매는 달다."
            ]
        }
    };

    function showQuotes(name) {
        const photoDisplay = document.getElementById('photo-display');
        const bioDisplay = document.getElementById('bio-display');
        const quoteDisplay = document.getElementById('quote-display');
        
        const data = philosopherData[name];
        
        // 사진 표시
        photoDisplay.src = data.photo;
        photoDisplay.style.display = 'block';
        
        // 생물연도 표시
        bioDisplay.innerText = `${name.toUpperCase()} (${data.bio})`;
        
        // 명언 표시
        quoteDisplay.innerHTML = ''; 
        data.quotes.forEach(quote => {
            const p = document.createElement('p');
            p.className = 'quote';
            p.innerText = quote;
            quoteDisplay.appendChild(p);
        });
    }
</script>

</body>
</html>
